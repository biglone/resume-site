projects:
  - name: "Whistle 智能声学监控平台"
    slug: "whistle-platform"
    category: "company"
    employer: "苏州清声学科技有限公司"
    featured: true
    period: "2022.10 - 至今"
    role: "C++/Qt 软件开发 · 核心模块参与者"
    description: "面向声音识别、声源定位、摄像头和设备管理的跨平台智能监控平台。"
    highlights: ["参与声音识别、声源定位、摄像头、证据生成和设备管理链路。", "参与 WebSocket/WebRTC 实时预览、诊断信息导出和 Web 管理端能力建设。", "维护 CMake、vcpkg、MSYS2、Docker 和 GitLab CI 跨平台构建发布流程。"]
    tags: ["C++17", "Qt6/QML", "OpenCV", "FFmpeg", "WebRTC", "CMake", "GitLab CI"]
    metrics:
      - { label: "产品形态", value: "跨平台桌面 + Web" }
      - { label: "核心链路", value: "采集 → 分析 → 预览 → 证据" }
      - { label: "工程重点", value: "实时性 / 可诊断 / 可发布" }
    detail: |
      ## 项目定位
      Whistle 是一套面向现场声学事件监控的跨平台系统，连接音频/视频采集、解码、时间同步、声源定位、识别算法、摄像头和证据输出。项目要求短促事件在 2 秒内、持续事件在 5 秒内完成证据闭环，因此重点不是单一算法，而是实时管线的可预测性。

      ## 我的工作
      - 将采集、预处理、识别和证据生成拆成队列化模块，降低算法耗时对采集线程的反压；音频按 1024 samples 分帧，并在音视频链路中保留时间戳。
      - 针对车牌识别第三方组件“单进程单路”的约束，参与多进程并行方案，避免单路识别成为多路监控的吞吐瓶颈。
      - 排查麦克风阵列偶发断连：定位到 XMOS 固件中 UDP 反射忙等阻塞 uIP 处理循环，并推动从现场重启规避转向固件侧根因修复。
      - 参与 WebSocket/WebRTC 预览、诊断信息导出、Windows/Linux 构建与 GitLab CI 失败定位，让现场问题可以复现和追踪。
  - name: "Acoustic Camera 声学成像平台"
    slug: "acoustic-camera-platform"
    category: "company"
    employer: "苏州清声学科技有限公司"
    featured: true
    period: "2022.10 - 至今"
    role: "C++/Qt 软件开发 · 设备与可视化模块参与者"
    description: "融合声学成像、频谱分析、PRPD、红外摄像头和 PTZ 控制的设备软件平台。"
    highlights: ["参与 OpenCV、FFmpeg、CUDA、MQTT、SQLite 和 Qt/QML 组成的设备软件链路。", "参与红外控制、设备兼容、抗闪烁、线程安全、增益和设备通信。", "配套云端管理和独立部署前端，覆盖诊断、升级、校准和安装包校验。"]
    tags: ["C++14", "Qt/QML", "OpenCV", "CUDA", "FFmpeg", "MQTT", "SQLite"]
    metrics:
      - { label: "算法/数据", value: "声源图 / 频谱 / PRPD" }
      - { label: "硬件链路", value: "红外 / PTZ / 麦克风" }
      - { label: "部署形态", value: "桌面端 + 云端管理" }
    detail: |
      ## 项目定位
      Acoustic Camera 将麦克风阵列采集结果转换为声源图、频谱和 PRPD 等分析结果，同时联动红外摄像头、PTZ 云台和设备管理服务，最终输出可复核的音视频数据包和报告。

      ## 我的工作
      - 参与红外摄像头、PTZ、麦克风和设备状态功能，处理设备查询时序、兼容版本和线程安全问题。
      - 参与 CUDA 热点优化：声源图矩阵生成约 35ms 降至 16ms，定位矩阵移动约 25ms 降至 3ms，归一化约 30ms 降至 4ms；同时清理不必要的 `cudaDeviceSynchronize`，减少同步开销。
      - 参与 Qt/QML 可视化、FFmpeg 数据处理、MQTT/SQLite 设备链路和 React 管理端之间的协作，把算法结果、设备状态和报告流程串起来。
