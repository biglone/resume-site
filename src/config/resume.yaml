    description: "把 Codex、Claude 和 Gemini CLI 接入 Matrix 房间的自托管 AI 网关。"
    highlights: ["支持三个 AI CLI 后端动态切换、会话持久化和跨后端上下文衔接。", "实现限流、并发控制、任务取消、进度通知、附件处理和请求可观测性。", "通过 Vitest、Playwright、GitHub Actions 和 NPM 发布形成完整工程闭环。"]
    tags: ["TypeScript", "Node.js", "Matrix", "SQLite", "Vitest", "Playwright", "NPM"]
    metrics:
      - { label: "AI 后端", value: "Codex / Claude / Gemini" }
      - { label: "运行形态", value: "Matrix Bot + CLI" }
      - { label: "工程闭环", value: "测试 / CI / NPM" }
    link: "https://github.com/biglone/CodeHarbor"
    detail: |
      ## 项目难点
      Matrix 房间消息天然是异步的，而 CLI 任务可能运行数分钟并产生附件、进度和交互式输出，因此需要把“消息回复”提升为可恢复的任务状态机。

      ## 架构
      Matrix Room → Channel Adapter → Orchestrator → AI CLI Executor
                                      ↓
                                  SQLite StateStore

      ## 我的贡献与技术亮点
      - 用 SQLite 持久化房间、用户、任务和 AI 会话映射，使机器人重启后可以继续识别上下文。
      - 用限流、并发闸门、取消机制和任务进度事件控制长时间 CLI 任务，避免一个房间拖垮整个网关。
      - 抽象图片、语音、生成文件和进度消息适配，并用 Vitest/Playwright 覆盖协议与端到端行为。
  - name: "Plover 计划驱动 GUI 自动化"
    slug: "plover"
    category: "personal"
    featured: true
    period: "个人项目 · 持续迭代"
    role: "独立设计与开发"
    description: "将 GUI 自动化任务外化为可审查、可修复、可回放的版本化计划。"
    highlights: ["采用 Planner、Executor、Frontend 分层，使用 gRPC 和 WebSocket 连接运行链路。", "支持失败检测、局部修复、人工审核、待执行步骤编辑和运行时间线。", "提供 Docker、macOS 宿主执行器、浏览器 E2E 和质量门禁。"]
    tags: ["Python", "FastAPI", "gRPC", "React", "Vite", "WebSocket", "Docker", "Playwright"]
    metrics:
      - { label: "核心抽象", value: "Versioned Plan" }
      - { label: "服务边界", value: "Planner / Executor / UI" }
      - { label: "验证方式", value: "Unit + E2E + Smoke" }
    link: "https://github.com/biglone/Plover"
    detail: |
      ## 项目难点
      GUI 自动化最难处理的不是点击本身，而是失败后如何知道失败在哪里、能否安全修复，以及修复是否改变了原计划意图。

      ## 关键设计
      - Planner 生成带版本的计划，Executor 只执行经过审核的步骤，并保留步骤级结果和时间线。
      - 通过 gRPC/WebSocket 传递计划、运行事件和人工干预，支持失败检测、局部修复和待执行步骤编辑。
      - Frontend 将计划审核、运行状态、失败原因和回放信息集中呈现，并用 Docker、Playwright 和 smoke test 验证真实链路。
