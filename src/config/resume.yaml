    role: "独立设计与开发"
    description: "将章节文稿、主视觉静帧、旁白混音和视频渲染组织为可复用的 2K 整集生产流水线。"
    highlights: ["以 episode.json、script.md 和 series profile 驱动章节化视频生产。", "支持 2048x1152 主视觉、章节视频渲染、旁白混音和整集合成。", "通过 smoke test、预设继承和脚本入口降低批量内容生产的重复配置。"]
