  - name: "Qwen3-TTS Jetson 语音服务"
    slug: "qwen3-tts-service"
    category: "personal"
    featured: true
    period: "个人项目 · 2026"
    role: "独立设计与开发"
    description: "部署在 Jetson GPU 环境的 Qwen3-TTS HTTP 服务，支持定制音色、声音设计、声音克隆和流式输出。"
    highlights: ["基于 FastAPI 封装 CustomVoice、VoiceDesign 和 VoiceClone 三类能力。", "支持同步、chunked 和 SSE 分段音频输出，统一 wav/mp3 结果格式。", "通过 Docker、NVIDIA runtime、模型缓存和环境变量适配 Jetson 部署。"]
    tags: ["Python", "FastAPI", "Qwen3-TTS", "Docker", "Jetson", "GPU", "SSE", "音频"]
    metrics:
      - { label: "能力形态", value: "Custom / Design / Clone" }
      - { label: "输出方式", value: "Sync / Stream / SSE" }
      - { label: "部署目标", value: "Jetson GPU" }
    link: "https://github.com/biglone/qwen3-tts-service"
    detail: |
      ## 项目定位
      Qwen3-TTS Service 把本地大模型语音能力封装成 HTTP 服务，面向 Jetson GPU 环境提供定制音色、文本驱动声音设计和参考音频克隆。

      ## 技术深挖
      - 通过 FastAPI 统一 `/v1/tts/custom`、`/design` 和 `/clone` 接口，分别覆盖内置音色、提示词设计和参考音频克隆。
      - 同时支持同步输出、chunked streaming 和 SSE 分段音频，返回 wav/mp3，便于桌面端、设备端和 Web 端接入。
      - Docker 使用 NVIDIA runtime、模型目录只读挂载和 HuggingFace 缓存，解决 GPU 运行时、模型体积和重复下载问题。
      - 通过 `/healthz`、`/v1/voices` 和 `/v1/models` 提供部署探针和能力发现，为后续接入设备服务保留稳定边界。

      ## 面试切入点
      可以讨论模型生命周期与请求并发、音频格式转换、流式接口的缓冲边界，以及 Jetson 资源受限环境中的模型缓存和部署策略。
  - name: "Video Automation 2K 章节视频流水线"
