    link: "https://github.com/biglone/matrix-open-stack"
    detail: |
      ## 项目定位
      Matrix Open Stack 将 homeserver、控制 API、Web 管理台和 Cloudflared 公网入口组合成一套可自托管通信基础设施，目标是让部署、初始化、备份和运维具备明确边界。

      ## 技术深挖
      - 通过 Docker Compose 编排 Conduwuit、control-plane 和管理页面，bootstrap 脚本负责生成环境和初始化流程。
      - 控制 API 覆盖空间、房间、用户、机器人、邀请、状态归档、Token 和运维操作，并用 audit log 保留敏感操作轨迹。
      - 用户/机器人创建默认关闭，只有本地安全脚本可以打开短暂维护窗口；邀请接口加入 IP 与 Token 指纹限流，降低公网暴露风险。
      - 提供备份、恢复、完整用户快照和 Cloudflared 模板，体现了从“能启动”到“可长期运行”的运维思维。

      ## 面试切入点
      可以从控制面与 homeserver 的职责划分、Docker socket 高风险能力如何默认关闭、审计日志和临时注册窗口如何降低误操作风险展开。
  - name: "FeedFlow 内容订阅与自动部署服务"
    slug: "feedflow"
    category: "personal"
    featured: false
    period: "个人项目 · 2026"
    role: "独立设计与开发"
    description: "面向视频/内容订阅的服务端系统，结合 RSS、YouTube 解析、数据库迁移和 GitHub Webhook 自动部署。"
    highlights: ["基于 Hono、Drizzle、PostgreSQL、Zod 和 JWT 组织服务端 API。", "集成 RSS、YouTube、代理、Cookies 和 PO Token provider 等真实内容源约束。", "通过独立生产目录、Webhook、systemd user service 和数据库迁移实现安全部署。"]
    tags: ["TypeScript", "Hono", "Drizzle", "PostgreSQL", "RSS", "YouTube", "Webhook", "systemd"]
    metrics:
      - { label: "服务端", value: "Hono + Drizzle" }
      - { label: "内容源", value: "RSS / YouTube" }
      - { label: "发布链路", value: "Webhook → Deploy → Migrate" }
    link: "https://github.com/biglone/feedflow"
    detail: |
      ## 项目定位
      FeedFlow 是一个面向内容订阅和视频处理的服务端项目，重点不只在 API，而在于把不稳定的外部内容源、代理/Cookies 配置和可回滚部署纳入系统设计。

      ## 技术深挖
      - 使用 Hono、Zod 和 JWT 组织边界清晰的 API，Drizzle 负责 PostgreSQL schema 和迁移，降低运行时字段漂移。
      - 对 YouTube bot-check 设计 Cookies 和 PO Token provider 配置，并把代理、解析失败和运行日志作为可诊断问题处理。
      - 部署脚本使用独立的 `feedflow-prod` 生产目录，避免 webhook 发布时误伤开发目录；push 事件触发 webhook，再执行构建、迁移和服务重启。
      - 通过 systemd user service 管理后端和 webhook，形成“代码变更 → 自动部署 → 数据库迁移 → 日志复盘”的闭环。

      ## 面试切入点
      可以讨论外部依赖不可靠时的配置隔离、生产目录与源码目录分离、数据库迁移失败如何阻止错误发布，以及 webhook 的安全边界。
