    highlights: ["使用 React 19 和 Vite 构建本地数据驱动的内容浏览界面。", "支持业务线、分类、书名/作者/摘要搜索和图书详情展开。", "设计 refined、playful、brand 三套主题，兼顾信息密度和长时间浏览体验。"]
